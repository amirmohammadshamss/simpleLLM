model:
  vocab_size: 8192
  n_layers: 8
  d_model: 384
  n_heads: 6
  d_ff: 1536
  context_length: 512
  dropout: 0.1
  tie_embeddings: true
training:
  seed: 42
  device: auto
  learning_rate: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_steps: 200
  eval_every_steps: 500
  save_every_steps: 500
