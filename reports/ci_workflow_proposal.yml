name: CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install CPU dependencies and package
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=reports/ci/tests.xml
      - name: Offline CPU smoke
        run: |
          python -m minigpt.training.smoke > reports/ci/smoke.json
          cat reports/ci/smoke.json
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-check-results
          path: reports/ci/
